name: Deploy

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/urban-space:staging
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL_TEST }}

      - name: Copy compose file to test server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST_TEST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.staging.yml"
          target: "~/urban-space/"

      - name: Deploy to test server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_TEST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/urban-space
            OLD_PID=$(sudo docker inspect --format '{{.State.Pid}}' urban-space-staging 2>/dev/null || true)
            [ -n "$OLD_PID" ] && [ "$OLD_PID" != "0" ] && sudo kill -9 $OLD_PID 2>/dev/null || true
            sleep 1
            sudo docker rm urban-space-staging 2>/dev/null || true
            DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/urban-space:staging sudo -E docker compose -f docker-compose.staging.yml up -d

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/urban-space:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL_PROD }}

      - name: Copy compose file to prod server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          password: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          source: "docker-compose.prod.yml"
          target: "~/urban-space/"

      - name: Deploy to prod server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          password: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          script: |
            cd ~/urban-space
            OLD_PID=$(sudo docker inspect --format '{{.State.Pid}}' urban-space-prod 2>/dev/null || true)
            [ -n "$OLD_PID" ] && [ "$OLD_PID" != "0" ] && sudo kill -9 $OLD_PID 2>/dev/null || true
            sleep 1
            sudo docker rm urban-space-prod 2>/dev/null || true
            DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/urban-space:latest sudo -E docker compose -f docker-compose.prod.yml up -d
